[package]
name = "indir"
version = "0.1.0"
description = "A tiny download manager"
authors = ["Bayram Akan"]
license = "MIT"
repository = "https://github.com/akancodes/indir"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
indir-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "time"] }
