[package]
name = "indir-engine"
version = "0.1.0"
description = "indir's download engine: one file over many connections, with pause and resume"
license = "MIT"
repository = "https://github.com/akancodes/indir"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
futures-util = "0.3"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "time"] }
tokio-util = "0.7"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
